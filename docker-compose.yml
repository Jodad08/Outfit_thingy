services:
  wardrobe:
    build: .
    image: wardrobe-assistant:latest
    container_name: wardrobe-assistant
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite database and garment images on the host.
      - wardrobe-data:/data
    environment:
      - WARDROBE_DATA_DIR=/data
    restart: unless-stopped

volumes:
  wardrobe-data:
