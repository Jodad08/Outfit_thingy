<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#111318" />
  <title>Wardrobe Assistant</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>👕 Wardrobe</h1>
    <span class="tagline">your personal fashion assistant</span>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="wardrobe">Closet</button>
    <button class="tab" data-view="add">Add</button>
    <button class="tab" data-view="build">Outfits</button>
    <button class="tab" data-view="saved">Saved</button>
    <button class="tab" data-view="insights">Insights</button>
  </nav>

  <main id="app">
    <!-- ============ WARDROBE ============ -->
    <section id="view-wardrobe" class="view active">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search items…" />
        <select id="filter-category"><option value="">All categories</option></select>
        <select id="filter-laundry">
          <option value="">Any status</option>
        </select>
      </div>
      <div id="wardrobe-grid" class="grid"></div>
      <p id="wardrobe-empty" class="empty hidden">No items yet. Tap <b>Add</b> to photograph your first garment.</p>
    </section>

    <!-- ============ ADD ITEM ============ -->
    <section id="view-add" class="view">
      <h2>Add a garment</h2>
      <div class="capture">
        <div id="preview" class="preview placeholder">Take or choose a photo</div>
        <div class="capture-buttons">
          <label class="btn primary">
            📷 Camera / Photo
            <input id="file-input" type="file" accept="image/*" capture="environment" hidden />
          </label>
          <span id="analyze-status" class="muted"></span>
        </div>
      </div>

      <form id="item-form" class="form">
        <label>Name<input name="name" required placeholder="e.g. White linen shirt" /></label>
        <div class="row">
          <label>Category<select name="category" required></select></label>
          <label>Subcategory<input name="subcategory" placeholder="button-down" /></label>
        </div>
        <div class="row">
          <label>Primary color
            <span class="color-field">
              <input type="color" name="primary_color_hex" value="#888888" />
              <span id="color-name" class="muted"></span>
            </span>
          </label>
          <label>Material<input name="material" placeholder="linen" /></label>
        </div>

        <fieldset><legend>Seasons</legend><div id="seasons-chips" class="chips"></div></fieldset>
        <fieldset><legend>Occasions</legend><div id="occasions-chips" class="chips"></div></fieldset>

        <div class="row">
          <label>Formality <output id="formality-out">5</output>
            <input type="range" name="formality_score" min="1" max="10" value="5" />
          </label>
          <label>Comfort <output id="comfort-out">7</output>
            <input type="range" name="comfort_score" min="1" max="10" value="7" />
          </label>
        </div>
        <div class="row">
          <label>Warmth <output id="warmth-out">5</output>
            <input type="range" name="warmth" min="1" max="10" value="5" />
          </label>
          <label class="check"><input type="checkbox" name="rain_safe" checked /> Rain-safe</label>
        </div>
        <div class="row">
          <label>Purchase price<input name="purchase_price" type="number" step="0.01" min="0" placeholder="0.00" /></label>
          <label>Laundry status<select name="laundry_status"></select></label>
        </div>
        <label>Notes<textarea name="notes" rows="2"></textarea></label>

        <div class="form-actions">
          <button type="submit" class="btn primary">Save to closet</button>
          <button type="button" id="add-reset" class="btn ghost">Clear</button>
        </div>
      </form>
    </section>

    <!-- ============ BUILD OUTFITS ============ -->
    <section id="view-build" class="view">
      <h2>Generate outfits</h2>
      <div class="form build-form">
        <div class="row">
          <label>Occasion<select id="rec-occasion"><option value="">Any</option></select></label>
          <label>Season<select id="rec-season"><option value="">Any</option></select></label>
        </div>
        <div class="row">
          <label>Temperature (°C)<input id="rec-temp" type="number" placeholder="e.g. 18" /></label>
          <label class="check"><input id="rec-rain" type="checkbox" /> Raining</label>
        </div>
        <button id="rec-go" class="btn primary">✨ Suggest outfits</button>
      </div>
      <div id="rec-results" class="outfits"></div>
    </section>

    <!-- ============ SAVED OUTFITS ============ -->
    <section id="view-saved" class="view">
      <h2>Saved outfits</h2>
      <div id="saved-results" class="outfits"></div>
      <p id="saved-empty" class="empty hidden">No saved outfits yet. Generate some and tap <b>Save</b>.</p>
    </section>

    <!-- ============ INSIGHTS ============ -->
    <section id="view-insights" class="view">
      <h2>Wardrobe insights</h2>
      <div id="insights" class="insights"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/js/app.js"></script>
</body>
</html>
